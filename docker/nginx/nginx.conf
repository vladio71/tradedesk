# Gateway: one public address (http://localhost:8080) in front of the three services.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream identity_service { server identity-service:3001; }
upstream wallet_service   { server wallet-service:3002; }
upstream market_service   { server market-service:3003; }

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/identity/ { proxy_pass http://identity_service; }
    location /api/wallet/   { proxy_pass http://wallet_service; }
    location /api/market/   { proxy_pass http://market_service; }

    # socket.io: the namespace /market lives on the market service.
    location /socket.io/ {
        proxy_pass http://market_service;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
